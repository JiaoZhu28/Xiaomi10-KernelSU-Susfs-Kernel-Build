name: Build Kernel
run-name: Build Kernel with KernelSU Next susfs
on:
  workflow_dispatch:
    inputs:
      phone:
        description: '选择手机型号：'
        required: true
        default: 'umi'
        type: choice
        options:
          - umi
          - cmi
      susfs:
        description: '是否集成SUSFS：'
        required: true
        default: 'SUSFS'
        type: choice
        options:
          - SUSFS
          - NoSUSFS
      version:
        description: '自定义版本名（如perf-xxx）可为空（则为n0kernel）'
        required: false
        type: string
jobs:
  build_job:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CI: "false"
    steps:

      - name: 0.检出本仓库
        uses: actions/checkout@v4

      - name: 1.安装上游 LLVM 14
        run: |
          if [ ! -d /usr/lib/llvm-14/bin ]; then
            echo "系统无 llvm-14，开始安装"
            sudo apt-get update -qq
            sudo apt-get install -y clang-14 llvm-14 lld-14
          else
            echo "系统已自带 llvm-14"
          fi
          echo "/usr/lib/llvm-14/bin" >> $GITHUB_PATH
          /usr/lib/llvm-14/bin/clang --version

      - name: 2.拉取源码与SUSFS
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone -b staging-umi https://github.com/jhchong94/kernel_xiaomi_sm8250_n0kernel --depth=1 android_kernel
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1 susfs

      - name: 3.添加KernelSU Next
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash

      - name: 4.修补KernelSU Next
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
          ls
          echo "复制补丁（来自主仓库 patches/）"
          cp $GITHUB_WORKSPACE/patches/* .
          echo "统一补丁行尾符 CRLF -> LF"
          for f in *.patch; do sed -i 's/\r$//' "$f"; done
          echo "应用 new_defconfig.patch"
          patch -p1 < new_defconfig.patch
          echo "应用 non-kprobes.patch"
          patch -p1 < non-kprobes.patch

      - name: 5.修补susfs
        run: |
          if [ ${{ inputs.susfs }} = 'SUSFS' ]; then
            echo "选择susfs修补"
            cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
            cp $GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/fs/* ./fs/
            cp $GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/include/linux/* ./include/linux/
            cp $GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
            echo "执行susfs补丁"
            patch -p1 < 50_add_susfs_in_kernel-4.19.patch || true
            echo "修复susfs补丁"
            patch -p1 < after_patch_fix.patch
          else
            echo "跳过susfs修补"
          fi

      - name: 6.开始构建
        run: |
          echo "=== 编译器 ==="
          which clang
          clang --version

          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel

          echo "=== 清理不兼容的编译参数 ==="
          # 1) MLGO：需要专用 clang 的模型文件
          sed -i '/-mllvm -regalloc-enable-advisor=release/d' Makefile
          sed -i '/-mllvm -enable-ml-inliner=release/d' Makefile
          # 2) cuda-path：对内核编译无意义
          sed -i 's|--cuda-path=/dev/null||' Makefile
          # 3) -fsplit-machine-functions：仅 x86 后端支持
          sed -i '/-fsplit-machine-functions/d' Makefile
          # 4) polly：Ubuntu clang 未编译 polly 库
          sed -i 's/^ifdef CONFIG_POLLY_CLANG$/ifdef CONFIG_POLLY_CLANG_DISABLED/' Makefile

          echo "清理后剩余的 mllvm 参数："
          grep -n "mllvm" Makefile || echo "  (无)"
          echo "polly 块开关状态："
          grep -n "CONFIG_POLLY_CLANG" Makefile || echo "  (未找到)"

          echo "=== 停用 syscall 完整性检查 ==="
          printf '#!/bin/sh\nexit 0\n' > scripts/checksyscalls.sh
          chmod +x scripts/checksyscalls.sh

          if [ ! -z ${{ inputs.version }} ]; then
            echo "自定义版本: ${{ inputs.version }}"
            sed -i '$s|echo "\$res"|echo "-${{ inputs.version }}"|' ./scripts/setlocalversion
          else
            echo "版本输入为空"
          fi

          if [ ${{ inputs.phone }} = 'umi' ]; then
            echo "选择小米10配置"
            DEFCONFIG=vendor/umi_defconfig
          elif [ ${{ inputs.phone }} = 'cmi' ]; then
            echo "选择小米10Pro配置"
            DEFCONFIG=vendor/cmi_defconfig
          else
            echo "输入错误"
            exit 1
          fi

          echo "当前配置为 $DEFCONFIG"

          make -j$(nproc --all) CC=clang O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-buildroot-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi- $DEFCONFIG
          make -j8 CC=clang O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: 7.复制boot文件
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel/out/arch/arm64/boot
          ls
          strings Image | grep "Linux version"
          mkdir -p $GITHUB_WORKSPACE/Anykernel/kernels/miui/
          cp Image $GITHUB_WORKSPACE/Anykernel/kernels/miui/

      - name: 8.上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.phone }}-KernelSU-Next-${{ inputs.susfs }}-AnyKernel3
          path: Anykernel/*
          retention-days: 3
